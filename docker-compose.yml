# Pinned so the volume keeps its name wherever the repository is cloned:
# compose otherwise names it after the directory, and a rename would look like
# lost data.
name: ai_shop_bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      # 5433 on the host so this stack can run next to another project's
      # Postgres on the default port.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Conversations and rate limits only: nothing here is worth persisting, so
  # Redis runs without snapshots.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 6380 on the host, next to another project's Redis on the default port.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Behind a profile because it needs a token the database does not, so
  # `docker compose up postgres` works for anyone running the bot with
  # `make run`. Start it with `make up`.
  bot:
    profiles: ["bot"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # BOT_DB picks another database in the same Postgres, e.g. one with a
      # real price list imported for local experiments.
      POSTGRES_DSN: postgres://shop:shop@postgres:5432/${BOT_DB:-shop}?sslmode=disable
      REDIS_ADDR: redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-45s}
      AGENT_HISTORY_MESSAGES: ${AGENT_HISTORY_MESSAGES:-30}
      AGENT_HISTORY_TTL: ${AGENT_HISTORY_TTL:-24h}
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-30}
      AGENT_RATE_WINDOW: ${AGENT_RATE_WINDOW:-1h}
      # Not ${VAR:?}: compose interpolates services behind inactive profiles
      # too, so a required variable would break `docker compose up postgres`.
      # The bot validates its own configuration and names what is missing.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      BOT_MAX_PENDING: ${BOT_MAX_PENDING:-256}
      BOT_HANDLER_TIMEOUT: ${BOT_HANDLER_TIMEOUT:-60s}
      MONOBANK_TOKEN: ${MONOBANK_TOKEN:-}
      MONOBANK_API_URL: ${MONOBANK_API_URL:-https://api.monobank.ua}
      PUBLIC_URL: ${PUBLIC_URL:-}
      BOT_HTTP_ADDR: ":8090"
      PAYMENT_RECONCILE_EVERY: ${PAYMENT_RECONCILE_EVERY:-30s}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      CART_REMINDER_AFTER: ${CART_REMINDER_AFTER:-24h}
      CART_REMINDER_EVERY: ${CART_REMINDER_EVERY:-10m}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Kyiv}
      SHOP_PICKUP_ADDRESS: ${SHOP_PICKUP_ADDRESS:-}
      AUTODB_API_URL: ${AUTODB_API_URL:-https://auto-db.pro/api/v1/}
      AUTODB_USER: ${AUTODB_USER:-}
      AUTODB_PASSWORD: ${AUTODB_PASSWORD:-}
      AUTODB_RPS: ${AUTODB_RPS:-4}
      AUTODB_BACKGROUND_RPS: ${AUTODB_BACKGROUND_RPS:-2}
      # Uploaded price lists wait here for "Apply", across restarts.
      IMPORT_DIR: /imports
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      # The payment webhook and /healthz; point a tunnel here in development.
      - "${BOT_PORT:-8090}:8090"
    restart: unless-stopped
    # The bot finishes in-flight updates on SIGTERM; give it the handler
    # timeout plus a margin before Docker kills it.
    stop_grace_period: 70s
    volumes:
      - imports:/imports

volumes:
  pgdata:
  imports:
